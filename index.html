<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Downtown Streets Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a study instrument. Slim header with study name and section stepper; one centred column per screen; sticky action bar at the bottom; walks fill the screen on a dark stage. */
:root{
  --paper:#F4F4F0; --card:#FFFFFF; --ink:#1B201D; --muted:#5D655F; --line:#DADDD6; --soft:#EEF0EB;
  --accent:#2E5A52; --accent-ink:#F4F7F5; --ochre:#B98A35; --warn:#9B3B26;
  --stage:#0F110F; --stage-ink:#F3F5F1;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131614; --card:#1B1F1C; --ink:#E7EAE5; --muted:#A2AAA4; --line:#2F3631; --soft:#232925;
  --accent:#8CC0B4; --accent-ink:#0F1F1B; --ochre:#D7AE60; --warn:#E89A86; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131614; --card:#1B1F1C; --ink:#E7EAE5; --muted:#A2AAA4; --line:#2F3631; --soft:#232925;
  --accent:#8CC0B4; --accent-ink:#0F1F1B; --ochre:#D7AE60; --warn:#E89A86; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar-in{max-width:720px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand b{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.005em}
.brand span{font-size:12px;color:var(--muted);text-align:right}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper div{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.stepper i{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.stepper i b{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}
.stepper div.now{color:var(--ink);font-weight:600}
main{max-width:720px;margin:0 auto;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:22px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);font-weight:600}
h1{font-family:var(--serif);font-size:clamp(30px,6vw,42px);line-height:1.08;margin:0;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--serif);font-size:clamp(24px,4.6vw,30px);line-height:1.15;margin:0;font-weight:500;text-wrap:balance}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--muted);font-weight:600}
p{margin:0}
.lead{font-size:18px;line-height:1.55}
.muted{color:var(--muted);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.facts b{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1.1}
.facts span{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols>div{min-width:0}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.clean li{padding-left:18px;position:relative}
ul.clean li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hero{position:relative;height:190px;border-radius:14px;overflow:hidden;background:var(--stage)}
.hero .track{position:absolute;inset:0 auto 0 0;display:flex;gap:4px;animation:pan 60s linear infinite}
.hero img{height:100%;width:auto;display:block;max-width:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 55%)}
.hero span{position:absolute;left:14px;bottom:10px;color:#fff;font-size:12.5px;z-index:1}
@keyframes pan{to{transform:translateX(-50%)}}
.scenario{font-family:var(--serif);font-size:21px;line-height:1.45;padding:18px 20px;border-left:3px solid var(--ochre);background:var(--card);border-radius:0 12px 12px 0}
.q{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q .t{font-weight:500;font-size:16.5px}
.likert{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.likert button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.likert button:hover{border-color:var(--accent)}
.likert button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.anchors{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:12px;color:var(--muted)}
.anchors span:nth-child(2){text-align:center}.anchors span:nth-child(3){text-align:right}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opts button::before{content:"";width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.opts button.on{border-color:var(--accent);background:var(--soft)}
.opts button.on::before{border:5px solid var(--accent)}
.opts.row{flex-direction:row;flex-wrap:wrap}.opts.row button{flex:1;min-width:110px}
input[type=number],input[type=text],textarea{font:inherit;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
input[type=number]{max-width:140px}
textarea{min-height:96px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.thumbs{display:flex;gap:4px;height:92px;border-radius:10px;overflow:hidden;background:var(--stage)}
.thumbs img{height:100%;width:auto;flex:1 1 0;min-width:0;object-fit:cover}
.prefs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pref{min-width:0;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.pref.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pthumbs{display:flex;gap:3px;height:120px;border-radius:8px;overflow:hidden;background:var(--stage)}
.pthumbs img{height:100%;width:auto;flex:1 1 0;min-width:0;object-fit:cover}
.plabel{font-weight:600;padding:0 4px 2px}
@media (max-width:560px){.prefs{grid-template-columns:minmax(0,1fr)}.pthumbs{height:96px}}
.walknum{font-family:var(--mono);font-size:13px;color:var(--muted)}
.bignum{font-family:var(--serif);font-size:64px;line-height:1;font-weight:500}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions-in{max-width:720px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{border-radius:10px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink);font-weight:500}
.hint{font-size:13px;color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.check:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.testbar{position:relative;background:var(--warn);color:#fff;font-size:12px;text-align:center;padding:3px 16px;z-index:30}
details summary{cursor:pointer}
/* walk stage */
#stage{position:fixed;inset:0;background:var(--stage);z-index:20;overflow:hidden}
.strip{position:absolute;left:0;top:0;height:100%;display:flex;will-change:transform}
.strip img{height:100%;width:auto;max-width:none;display:block;margin-right:-40px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40px);mask-image:linear-gradient(90deg,transparent 0,#000 40px)}
.strip img:first-child{-webkit-mask-image:none;mask-image:none}
#turnwrap{position:absolute;inset:0;perspective:900px}
.view{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;will-change:transform,opacity}
#sidelab{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:18px;z-index:21;color:var(--stage-ink);background:rgba(0,0,0,.45);padding:5px 11px;border-radius:6px;font-size:13px;transition:opacity .5s}
#wbar{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.18);z-index:21}
#wbar i{display:block;height:100%;width:0;background:var(--stage-ink)}
#wlabel{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--stage-ink);background:rgba(0,0,0,.45);padding:6px 12px;border-radius:20px;font-family:var(--mono);font-size:13px;z-index:21}
#skip{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:21;background:rgba(0,0,0,.45);color:var(--stage-ink);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
#ph{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--warn);color:#fff;padding:4px 10px;border-radius:6px;font-size:12.5px;z-index:21}
@media (max-width:560px){.cols{grid-template-columns:1fr}.facts b{font-size:21px}.likert button{height:42px}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.hero .track{animation:none}.stepper i b{transition:none}}

.brand{align-items:center}
.brand span{margin-inline-start:auto}
.langbtn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.langbtn:hover{border-color:var(--accent)}
ul.clean li{padding-left:0;padding-inline-start:18px}
ul.clean li::before{left:auto;inset-inline-start:0}
.opts button{text-align:start}
.anchors span:nth-child(3){text-align:end}
.scenario{border-left:0;border-inline-start:3px solid var(--ochre)}
[dir=rtl] .scenario{border-radius:12px 0 0 12px}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] textarea{font-family:"IBM Plex Sans Arabic",var(--sans)}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] .scenario,[dir=rtl] .facts b,[dir=rtl] .bignum,[dir=rtl] .brand b{font-family:"IBM Plex Sans Arabic",var(--sans);font-weight:600;letter-spacing:0}
[dir=rtl] .eyebrow,[dir=rtl] h3,[dir=rtl] .stepper div{letter-spacing:0;text-transform:none}
[dir=rtl] .lead{line-height:1.75}
@media (max-width:560px){.brand span{display:none}.langbtn{margin-inline-start:auto}}
</style>
</head>

  const t=T();
  screen(`<div><p class="eyebrow">${t.part(2,t.sections[1])}</p><h2>${t.beforeH}</h2></div>
  <p class="lead">${t.beforeLead}</p>
  <div class="scenario">${t.scenario}</div>
  <div class="cols"><div class="panel"><h3>${t.walksH}</h3><p>${t.walksP}</p></div><div class="panel"><h3>${t.qsH}</h3><p>${t.qsP}</p></div></div>`,{next,nextLabel:t.startWalks});
}
function part2(){ const t=T(); screen(`<div><p class="eyebrow">${t.part(3,t.sections[2])}</p><h2>${t.moreH}</h2></div><p class="lead">${t.moreP}</p>`,{next}); }

function walkStart(i){
  const t=T(), item=ALL[i];
  screen(`<div><p class="eyebrow">${item.part===1?t.part(2,t.sections[1]):t.part(3,t.sections[2])}</p></div>
  <div class="panel" style="align-items:flex-start;gap:10px"><span class="walknum">${t.walk}</span><div class="bignum">${num(i+1)}<span class="muted" style="font-size:20px"> / ${num(ALL.length)}</span></div><p>${t.remind}</p></div>`,
  {next:()=>playWalk(item.code,(watched,skipped)=>{ R[`${item.code}_watched_seconds`]=watched; R[`${item.code}_skipped`]=skipped?"yes":"no"; next(); }),nextLabel:t.startWalk});
}

const DRAFT={};
function rate(i){
  const t=T(), item=ALL[i], p=item.code, t0=performance.now();
  const A=DRAFT[p]||(DRAFT[p]={}); for(const k of ["f1","f2","f3","f4","like"]) if(R[`${p}_${k}`]&&!A[k]) A[k]=R[`${p}_${k}`]; if(R[`${p}_recognise`]&&!A.recognise) A.recognise=R[`${p}_recognise`];
  const thumbs=seq(p).seq.slice(0,6).map(x=>`<img alt="" src="${x.src}">`).join("");
  const likert=(id,text)=>`<div class="q"><span class="t">${esc(text)}</span><div class="likert" data-q="${id}" role="radiogroup" aria-label="${esc(text)}">${[1,2,3,4,5,6,7].map(n=>`<button type="button" role="radio" aria-checked="${A[id]===n}" data-v="${n}" class="${A[id]===n?"on":""}">${num(n)}</button>`).join("")}</div><div class="anchors"><span>${t.anchors[0]}</span><span>${t.anchors[1]}</span><span>${t.anchors[2]}</span></div></div>`;
  screen(`<div><p class="eyebrow">${t.walkOf(num(i+1),num(ALL.length))}</p><h2>${t.rateH}</h2></div>
  <div class="thumbs" aria-hidden="true">${thumbs}</div>
  <div class="panel">${t.fatigue.map((s,k)=>likert("f"+(k+1),s)).join("")}${likert("like",t.like)}
  <div class="q"><span class="t">${t.recog}</span>${choice("recognise",["Yes","Not sure","No"],true,A.recognise)}</div></div>`,
  {next:()=>{
    R[`${p}_position`]=i+1;
    for(const k of ["f1","f2","f3","f4","like"]) R[`${p}_${k}`]=A[k];
    R[`${p}_fatigue`]=+(((A.f1+A.f2+A.f3+(8-A.f4))/4).toFixed(2));
    R[`${p}_recognise`]=A.recognise;
    R[`${p}_answer_seconds`]=(R[`${p}_answer_seconds`]||0)+Math.round((performance.now()-t0)/1000);
    next(); },nextLabel:i===ALL.length-1?t.cont:t.nextWalk});
  const check=()=>setReady(["f1","f2","f3","f4","like","recognise"].every(k=>A[k]));
  document.querySelectorAll(".likert").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ g.querySelectorAll("button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-checked",x===b);}); A[g.dataset.q]=+b.dataset.v; check(); }));
  wireChoices(A,check); check();
}

function prefer(){
  const t=T(); let pick=R._pref_draft||R.prefer_choice||null;
  const opt=(code,k)=>`<button type="button" class="pref${pick===code?" on":""}" data-v="${code}" role="radio" aria-checked="${pick===code}">
    <span class="pthumbs">${seq(code).seq.slice(0,4).map(x=>`<img alt="" src="${x.src}">`).join("")}</span><span class="plabel">${t.prefLabel(k)}</span></button>`;
  screen(`<div><p class="eyebrow">${t.part(3,t.sections[2])}</p><h2>${t.prefH}</h2></div><p class="muted">${t.prefP}</p>
  <div class="prefs" role="radiogroup">${PREF_ORDER.map(opt).join("")}</div>`,
  {next:()=>{ R.prefer_choice=pick; R.prefer_position=PREF_ORDER.indexOf(pick)+1; delete R._pref_draft; next(); }});
  const check=()=>setReady(!!pick,T().prefHint);
  document.querySelectorAll(".pref").forEach(b=>b.onclick=()=>{ pick=b.dataset.v; R._pref_draft=pick; document.querySelectorAll(".pref").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-checked",x===b);}); check(); });
  check();
}

function background(){
  const t=T(), A={gender:R.gender,occupation:R.occupation,dt_reason:R.dt_reason};
  screen(`<div><p class="eyebrow">${t.part(4,t.sections[3])}</p><h2>${t.lastH}</h2></div>
  <div class="panel">
  <div class="q"><span class="t">${t.gender}</span>${choice("gender",["Female","Male","Prefer not to say"],true,A.gender)}</div>
  <div class="q"><span class="t">${t.occ}</span>${choice("occupation",["Student","Employed","Self-employed","Not working","Other"],false,A.occupation)}</div>
  <div class="q"><label class="t" for="area">${t.area}</label><input type="text" id="area" maxlength="60" placeholder="${t.areaPh}" value="${esc(R.area||"")}"></div>
  <div class="q"><span class="t">${t.reason}</span>${choice("dt_reason",["Work","Study","Living there","Shopping or leisure","I don't go regularly"],false,A.dt_reason)}</div>
  <div class="q"><label class="t" for="comment">${t.comment} <span class="muted">${t.optional}</span></label><textarea id="comment" maxlength="600">${esc(R.comment||"")}</textarea></div>
  </div>`,{next:()=>{ Object.assign(R,A,{area:$("area").value.trim(),comment:$("comment").value.trim()}); finish(); },nextLabel:t.submit});
  const check=()=>{ Object.assign(R,{gender:A.gender,occupation:A.occupation,dt_reason:A.dt_reason,area:$("area").value.trim(),comment:$("comment").value.trim()}); setReady(A.gender&&A.occupation&&A.dt_reason); };
  wireChoices(A,check); $("area").oninput=check; $("comment").oninput=check; check();
}

/* ---------- walk player: left side passes, the view turns, right side passes ---------- */
function playWalk(code,done){
  const {seq:all}=seq(code);
  const L=all.filter(x=>x.side==="Left"), Rt=all.filter(x=>x.side==="Right");
  const st=$("stage"); $("actions").hidden=true;
  const imgs=list=>list.map(x=>`<img alt="" src="${x.src}" decoding="async">`).join("");
  st.innerHTML=`<div id="turnwrap" dir="ltr"><div class="view" id="vL"><div class="strip" id="sL">${imgs(L)}</div></div><div class="view" id="vR" style="opacity:0"><div class="strip" id="sR">${imgs(Rt)}</div></div></div>`;
  st.hidden=false; ["wbar","wlabel","skip","sidelab"].forEach(id=>$(id).hidden=false);
  const stripW=list=>{ const H=st.clientHeight; return list.reduce((a,x)=>a+H*x.w/x.h-40,40); };
  const T_=CONFIG.WALK_SECONDS, TURN=1.6, SIDE=(T_-TURN)/2;
  const lab=$("sidelab"); lab.textContent=T().left; lab.style.opacity=1;
  const t0=performance.now(); let ended=false, phase=0;
  const end=(skipped)=>{ if(ended) return; ended=true; const watched=Math.min(T_,(performance.now()-t0)/1000);
    st.hidden=true; ["wbar","wlabel","skip","sidelab"].forEach(id=>$(id).hidden=true); st.innerHTML=""; done(+watched.toFixed(1),skipped); };
  $("skip").onclick=()=>end(true);
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  const tick=()=>{ if(ended) return;
    const t=(performance.now()-t0)/1000, vw=st.clientWidth; if(t>=T_){ end(false); return; }
    const sL=$("sL"), sR=$("sR"), vL=$("vL"), vR=$("vR");
    const pL=Math.min(1,t/SIDE); sL.style.transform=`translateX(${-Math.max(0,stripW(L)-vw)*pL}px)`;
    const pR=Math.max(0,Math.min(1,(t-SIDE-TURN)/SIDE)); sR.style.transform=`translateX(${-Math.max(0,stripW(Rt)-vw)*(1-pR)}px)`;
    if(t>SIDE && t<SIDE+TURN){ const q=ease((t-SIDE)/TURN);
      vL.style.transform=`translateX(${-q*40}%) rotateY(${q*75}deg)`; vL.style.opacity=1-q;
      vR.style.transform=`translateX(${(1-q)*40}%) rotateY(${-(1-q)*75}deg)`; vR.style.opacity=q;
      if(phase===0){ phase=1; lab.style.opacity=0; } }
    else if(t>=SIDE+TURN && phase<2){ phase=2; vL.style.opacity=0; vR.style.transform="none"; vR.style.opacity=1; lab.textContent=T().right; lab.style.opacity=1; }
    $("wfill").style.width=(100*t/T_)+"%"; $("wlabel").textContent=num(`0:${String(Math.ceil(T_-t)).padStart(2,"0")}`);
    requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* ---------- saving ---------- */
async function submit(screenedOut=false){
  R.finished_at=new Date().toISOString();
  R.total_minutes=+(((Date.now()-new Date(R.started_at))/60000).toFixed(1));
  R.completed=screenedOut?"screened_out":"yes"; R.language=LANG;
  const row={...R}; for(const k of Object.keys(row)) if(k.startsWith("_")) delete row[k];
  if(TEST){ console.log("Test mode, not saved:",row); return {ok:true,test:true,row}; }
  try{
    await fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(row)});
    try{ localStorage.setItem("dtsurvey_done","1"); }catch(e){}
    return {ok:true};
  }catch(e){ return {ok:false,row}; }
}
async function finish(){
  current=()=>screen(`<h2>${T().savingH}</h2><p class="muted">${T().savingP}</p>`); current();
  const r=await submit();
  if(!r.ok){ current=()=>screen(`<h2>${T().failH}</h2><p class="lead">${T().failP}</p>`,{next:finish,nextLabel:T().retry,back:false}); current(); return; }
  finished=true; renderStepper();
  current=()=>{ const t=T(); screen(`<div><p class="eyebrow">${t.doneEb}</p><h1>${t.doneH}</h1></div>
  <p class="lead">${r.test?t.doneTest:t.doneP}</p>
  <div class="panel"><h3>${t.aboutStudyH}</h3><p>${t.aboutStudyP}</p></div>
  ${r.test?`<details dir="ltr"><summary class="muted">Test mode: the row that would be saved</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(r.row,null,1))}</pre></details>`:""}`); renderStepper(); };
  current();
}

/* ---------- start ---------- */
if(TEST) document.body.insertAdjacentHTML("afterbegin",`<div class="testbar"></div>`);
applyLang();
let already=false; try{ already=localStorage.getItem("dtsurvey_done")==="1"; }catch(e){}
if(already && !TEST){ finished=true; renderStepper(); current=()=>screen(`<h2>${T().alreadyH}</h2><p class="lead">${T().alreadyP}</p>`); current(); }
else go(0);
setTimeout(()=>{ for(const c of PART1) for(const x of STREETS[c].seq){ const im=new Image(); im.src=x.src; } },1500);
</script>
